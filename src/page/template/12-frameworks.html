<sc-if value="{{showFw}}" hint-placeholder-val="{{false}}">
<section aria-label="Frameworks" style="background: var(--surface); border: 1px solid var(--hair-soft); box-shadow: var(--shadow-1); border-radius: var(--r-lg); padding: 16px 18px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: flex-start">
<div style="display: flex; flex-direction: column; gap: 4px; max-width: 820px"><h2 style="margin: 0; font-size: 18px">Frameworks behind ArchStudio</h2><span style="font-size: 13px; color: var(--ink-3)">Each standard, where you use it here, and its official source. TOGAF Requirements Management runs through every phase; in ArchStudio your brief and constraints carry the requirements.</span></div>
<button type="button" onClick="{{toggleFw}}" style="min-height: 40px; padding: 6px 14px; border-radius: 999px; border: 1px solid transparent; background: var(--fill); color: var(--ink); font-size: 14px">Close</button>
</div>
<div style="display: flex; flex-direction: column">
<sc-for list="{{fwAll}}" as="f" hint-placeholder-count="4">
<div style="display: flex; flex-wrap: wrap; gap: 6px 20px; padding: 12px 0; border-top: 1px solid var(--hair)">
<div style="flex: 1 1 240px; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-weight: 600; font-size: 14px">{{f.n}}</span>
<span style="font-family: var(--mono); font-size: 11px; color: var(--ink-3)">{{f.by}}</span>
<sc-if value="{{f.here}}" hint-placeholder-val="{{false}}"><span style="align-self: flex-start; margin-top: 4px; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-ink)">Used on this step</span></sc-if>
</div>
<div style="flex: 3 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 14px; color: var(--ink-2)">{{f.use}}</span>
<div style="display: flex; flex-wrap: wrap; gap: 6px; align-items: center">
<sc-for list="{{f.steps}}" as="x" hint-placeholder-count="2">
<button type="button" onClick="{{x.go}}" aria-disabled="{{x.off}}" title="{{x.tip}}" style="min-height: 32px; padding: 2px 10px; border-radius: 999px; border: 1px solid {{x.bd}}; background: {{x.bg}}; color: {{x.fg}}; font-size: 12px">{{x.l}}</button>
</sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 4px 14px">
<sc-for list="{{f.links}}" as="u" hint-placeholder-count="1">
<a href="{{u.u}}" target="_blank" rel="noopener noreferrer" style="font-size: 13px">{{u.t}}</a>
</sc-for>
</div>
</div>
</div>
</sc-for>
</div>
</section>
</sc-if>
